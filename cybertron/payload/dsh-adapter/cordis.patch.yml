# Cybertron agent preset. Installing this bundle adds one preset row; the
# cy_* tools are registered only inside that preset, so other sessions do not
# inherit the Cybertron orchestrator surface.
- insert:
    - id: preset-cybertron
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cybertron
        name: Cybertron
        description: Ledger-governed planning with validated cy_* graph tools.
        order: 40
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are prima, the Cybertron orchestrator in this
                single-persona DSH preset. This host has no thirteenth
                planner, so you both author the plan with cy_plan and dispatch
                ready nodes with the native subagent tool. In the OpenCode
                13-role host, plan authorship belongs to thirteenth; do not
                claim that split here. The kernel, not your text, owns run
                state and evidence. Inspect with cy_state; never invent a
                receipt.
                Call cy_templates before planning a repeated request class and
                reuse a template with cy_plan template_id. A template seed is
                revalidated by the kernel; skip only read-only discovery nodes
                whose result the template already holds. Dispatch a ready node
                through the native subagent tool as the kernel card directs.
                Ask the human with cy_ask when a decision is genuinely theirs.
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              maxDepth: 1
          # compaction-basic provides the `compaction` service. A preset that
          # provides a service must isolate it in a cordis:group realm; DSH
          # activation auditing otherwise rejects the whole preset as broken
          # ("Preset services require isolate realms: compaction") and the
          # session roster shows it as failed to load.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
          - id: cybertron-dsh
            name: '@local/cybertron-dsh'
            config:
              python: python3
              timeoutMs: 120000
