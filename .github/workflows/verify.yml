name: verify

on:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install clang-tidy
        run: brew install llvm

      - name: Test and verify isolation
        run: |
          python -m unittest discover -s tests -v
          python -m cybertron.stage5_verify
          python cybertron_primes_engine.py
      - name: Verify npm and Python package contents
        run: |
          node scripts/build-payload.mjs
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/npm-pack.json"
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/wheels"
          python scripts/verify_packages.py "$RUNNER_TEMP/npm-pack.json" "$RUNNER_TEMP/wheels"
