name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag on main to publish
        required: true
        type: string
      publish_pypi:
        description: Publish to PyPI (disable for an npm-only retry)
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify tag, main ancestry, and versions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor HEAD origin/main
          python scripts/bump_version.py "${RELEASE_TAG#v}" --check
          test -f "docs/releases/${RELEASE_TAG}.md"
      - name: Install clang-tidy
        run: brew install llvm

      - name: Run release gates
        run: |
          python -m unittest discover -s tests -v
          python -m cybertron.stage5_verify
          python cybertron_primes_engine.py

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and compare distribution contents
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          python -m pip install --upgrade build twine
          node scripts/build-payload.mjs
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/npm-pack.json"
          python -m build --sdist --wheel --outdir dist
          python scripts/verify_packages.py "$RUNNER_TEMP/npm-pack.json" dist
          python -m twine check dist/*.whl dist/*.tar.gz
          mv "cybertron-agents-${RELEASE_TAG#v}.tgz" dist/
          cp install.sh dist/install.sh
          (cd dist && sha256sum *.tgz *.whl *.tar.gz install.sh > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Publish to npm with OIDC
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          npm install --global npm@^11
          npm publish "./dist/cybertron-agents-${RELEASE_TAG#v}.tgz" --access public --provenance

  pypi:
    needs: build
    if: ${{ inputs.publish_pypi }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Select Python distributions
        run: |
          mkdir python-dist
          mv dist/*.whl dist/*.tar.gz python-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/

  github_release:
    needs: [npm, pypi]
    if: ${{ !cancelled() && needs.npm.result == 'success' && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Create GitHub Release with the built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --notes-file "docs/releases/${RELEASE_TAG}.md" \
            --repo "$GITHUB_REPOSITORY"
