[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cybertron-agents"
version = "0.1.0"
description = "Install the 13 Cybertron Primes agents and the /cybertron command into OpenCode"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["opencode", "agents", "cybertron", "multi-agent"]

[project.urls]
Homepage = "https://github.com/zhiwenC125/Cybertron-agents"
Repository = "https://github.com/zhiwenC125/Cybertron-agents.git"

[project.scripts]
cybertron = "cybertron.installer:main"

[tool.setuptools.packages.find]
include = ["cybertron*"]
exclude = ["tests*"]
