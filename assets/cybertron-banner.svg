  <circle cx="980" cy="180" r="105" fill="none" stroke="#c783fa" stroke-opacity=".38" stroke-width="1.5"/>
  <circle cx="980" cy="180" r="78" fill="none" stroke="#77f7ff" stroke-opacity=".52" stroke-width="2"/>
  <path d="M980 92 1056 136v88l-76 44-76-44v-88z" fill="#141b4c" stroke="url(#neon)" stroke-width="3"/>
  <path d="M980 116v128m-48-96h96m-96 64h96" fill="none" stroke="#a7faff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="980" cy="180" r="14" fill="#9befff" filter="url(#glow)"/>
  <circle cx="980" cy="180" r="8" fill="#f4ffff"/>
  <g fill="#8af8ff" stroke="#8af8ff" stroke-opacity=".4" stroke-width="8">
    <circle cx="980" cy="48" r="3"/><circle cx="1036" cy="61" r="3"/><circle cx="1082" cy="97" r="3"/>
    <circle cx="1111" cy="149" r="3"/><circle cx="1107" cy="207" r="3"/><circle cx="1076" cy="257" r="3"/>
    <circle cx="1026" cy="290" r="3"/><circle cx="968" cy="311" r="3"/><circle cx="914" cy="294" r="3"/>
    <circle cx="866" cy="258" r="3"/><circle cx="847" cy="200" r="3"/><circle cx="854" cy="141" r="3"/>
    <circle cx="900" cy="82" r="3"/>
  </g>
