  <text x="74" y="65" fill="#8cf9ff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">V6 • TASK GRAPH</text>
  <text x="54" y="178" fill="#f5f7ff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="4">CYBERTRON</text>
  <rect x="57" y="205" width="625" height="3" rx="2" fill="url(#neon)"/>
  <text x="57" y="252" fill="#c9d6ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" letter-spacing="5">THIRTEEN PRIMES</text>
  <text x="57" y="292" fill="#9aaad4" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1.6">PLAN  /  EXECUTE  /  VERIFY  /  RECOVER</text>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="url(#neon)" stroke-opacity=".45" stroke-width="2"/>
