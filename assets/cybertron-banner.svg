<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Cybertron Thirteen Primes</title>
  <desc id="desc">Neon circuit banner for the Cybertron v6 agent workflow</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1">
      <stop stop-color="#080d25"/>
      <stop offset=".54" stop-color="#111138"/>
      <stop offset="1" stop-color="#220c38"/>
    </linearGradient>
    <linearGradient id="neon" x2="1" y2="0">
      <stop stop-color="#73f8ff"/>
      <stop offset=".55" stop-color="#8b8cff"/>
      <stop offset="1" stop-color="#f67adf"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#8b8cff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#8b8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8f9ce2" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#night)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 286h146l40-40h112m-298 70h208l37-37h96M1200 39h-131l-41 41h-77m249-16h-94l-38 38h-90" fill="none" stroke="#72f6ff" stroke-opacity=".28" stroke-width="2"/>
  <path d="M0 294h136l44-44h94M1200 308h-95l-40-40h-80" fill="none" stroke="#fa78df" stroke-opacity=".24" stroke-width="2"/>
  <circle cx="980" cy="180" r="220" fill="url(#aura)"/>
